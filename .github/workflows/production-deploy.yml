name: Build and Deploy Knowledge Base

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build (MkDocs) and Deploy to Production

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install MkDocs Material
      run: pip install mkdocs-material

    - name: Build site
      run: mkdocs build

    - name: Deploy to production server
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          set -e
          echo "Backing up current site..."
          sudo cp -r /var/www/zaylegend/apps/knowledge-base /var/www/zaylegend/apps/knowledge-base-backup-$(date +%Y%m%d-%H%M%S) || echo "Backup failed, continuing..."

    - name: Copy built site to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        source: "site/"
        target: "/var/www/zaylegend/apps/knowledge-base/"
        strip_components: 1

    - name: Reload nginx
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          sudo chown -R langchain:www-data /var/www/zaylegend/apps/knowledge-base/
          find /var/www/zaylegend/apps/knowledge-base/ -type f -exec chmod 644 {} \;
          find /var/www/zaylegend/apps/knowledge-base/ -type d -exec chmod 755 {} \;
          sudo nginx -t
          sudo systemctl reload nginx
          echo "Deployed successfully to https://zaylegend.com/knowledge-base/"

    - name: Deployment summary
      run: |
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Live at: https://zaylegend.com/knowledge-base/"
