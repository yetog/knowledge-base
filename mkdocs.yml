site_name: Isayah Young Burke
site_url: https://zaylegend.com/knowledge-base/
site_description: Personal knowledge base and learning insights by Isayah Young Burke
site_author: Isayah Young Burke

repo_url: https://github.com/yetog/knowledge-base
repo_name: yetog/knowledge-base
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs           # top-level sections as tabs
    - navigation.tabs.sticky    # tabs stay visible on scroll
    - navigation.sections       # expand sections in sidebar
    - navigation.expand         # auto-expand active section
    - navigation.top            # back-to-top button
    - navigation.indexes        # section index pages
    - search.suggest
    - search.highlight
    - content.code.copy         # copy button on code blocks
    - content.action.edit       # edit page link

plugins:
  - search
  - tags:
      tags_file: tags.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

